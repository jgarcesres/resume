name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run lint
        run: cd app && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run tests
        run: cd app && npm run test

  wasm:
    name: WASM (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdf-unlock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/pdf-unlock

      - name: Install wasm-pack
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: wasm-pack@0.15.0

      - name: Format
        run: cargo fmt --check

      - name: Clippy (native + wasm32)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test

      # The committed build is what ships (Cloudflare and Docker don't build Rust),
      # so rebuild it here and require the exact same bytes.
      - name: Rebuild WASM and compare with the committed build
        run: |
          bash scripts/build.sh
          if [ -n "$(git status --porcelain -- ../../app/src/wasm)" ]; then
            git status --short -- ../../app/src/wasm
            echo "::error::app/src/wasm/pdf-unlock differs from a clean build. Run 'npm run build:wasm' in app/ and commit the result."
            exit 1
          fi

      - name: "TEMP: build stages for reproducibility debugging"
        if: failure()
        run: |
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$PWD=/pdf-unlock"
          wasm-pack build --release --no-opt --target web --out-dir "$RUNNER_TEMP/noopt" --out-name pdf_unlock
          mkdir -p "$RUNNER_TEMP/stages"
          cp target/wasm32-unknown-unknown/release/pdf_unlock.wasm "$RUNNER_TEMP/stages/rustc.wasm"
          cp "$RUNNER_TEMP/noopt/pdf_unlock_bg.wasm" "$RUNNER_TEMP/stages/bindgen-noopt.wasm"
          cp ../../app/src/wasm/pdf-unlock/pdf_unlock_bg.wasm "$RUNNER_TEMP/stages/final.wasm"
          ls -la ~/.cache/.wasm-pack 2>/dev/null || true; find ~/.cache/.wasm-pack -maxdepth 2 2>/dev/null | head -20 || true

      - name: Upload the CI build for comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-unlock-wasm-ci
          path: |
            app/src/wasm/pdf-unlock/
            ${{ runner.temp }}/stages/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, wasm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build site
        run: cd app && npm run build

  docker-build:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [lint, test, wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enabled=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
