[package]
name = "pdf-unlock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Remove the password from a PDF in the browser, via WebAssembly"
license = "MIT"
repository = "https://github.com/jgarcesres/resume"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }
md-5 = "0.11"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
